<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#081017">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=3">
  <title>My 3D World</title>
</head>
<body>
  <video id="camera" autoplay playsinline muted aria-label="Front camera view"></video>
  <div id="shade"></div>
  <div id="space" aria-hidden="true"></div>

  <div class="hud">
    <div class="brand">3D WORLD</div>
    <div class="status"><strong id="sensor-status">SENSOR STANDBY</strong><br><span id="orientation">PORTRAIT / TURN PHONE</span></div>
  </div>

  <main class="menu-node">
    <button class="menu-button" id="menu-button" aria-label="Open spatial menu"></button>
  </main>

  <section class="panel" id="panel" aria-label="Menu editor">
    <div class="panel-head"><div><div class="panel-title">Place a note</div><div class="panel-meta">ANCHORED TO FIRST HEADING</div></div><button class="close" id="close" aria-label="Close menu">&times;</button></div>
    <form class="entry" id="entry"><input id="note" type="text" maxlength="80" placeholder="Type something here..." autocomplete="off"><button type="submit">Add</button></form>
    <div class="saved" id="saved" aria-live="polite"></div>
  </section>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
