<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#081017">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=6">
  <title>My 3D World</title>
</head>
<body>
  <video id="camera" autoplay playsinline muted aria-label="Front camera view"></video>
  <div id="shade"></div>
  <div id="space" aria-hidden="true"></div>

  <div class="hud">
    <div class="brand">3D WORLD</div>
    <div class="status"><strong id="sensor-status">SENSOR STANDBY</strong><br><span id="orientation">PORTRAIT / TURN PHONE</span><br><button class="camera-permission" id="camera-permission" type="button" hidden>ENABLE CAMERA</button></div>
  </div>

  <div class="gaze-cursor" id="gaze-cursor" aria-hidden="true"><span></span></div>

  <main class="menu-node">
    <button class="menu-button" id="menu-button" aria-label="Open spatial menu"></button>
  </main>

  <section class="panel main-panel" id="panel" aria-label="Main menu">
    <div class="panel-head"><div><div class="panel-title">My World</div><div class="panel-meta">MAIN MENU</div></div><button class="close" id="close" aria-label="Close menu">&times;</button></div>
    <nav class="menu-actions" aria-label="Main menu options">
      <button class="menu-action" id="youtube-button" type="button">YouTube</button>
      <button class="menu-action" id="settings-button" type="button">Settings</button>
    </nav>
    <div class="saved" id="feedback" aria-live="polite"></div>
  </section>

  <section class="panel nested-panel" id="nested-panel" aria-label="Secondary menu">
    <div class="panel-head"><div><div class="panel-title" id="nested-title">YouTube</div><div class="panel-meta" id="nested-meta">VIDEO SPACE</div></div><button class="close" id="nested-close" aria-label="Close secondary menu">&times;</button></div>
    <div id="youtube-tools">
      <div class="subtle-copy">Bring a video into your world.</div>
      <form class="entry" id="youtube-entry"><input id="youtube-url" type="text" placeholder="YouTube link or 11-character ID" autocomplete="off"><button type="submit">Open</button></form>
      <div class="wall-choices" id="wall-choices" hidden>
        <div class="panel-meta">CHOOSE A WALL</div>
        <button class="menu-action" data-wall="back" type="button">Back wall</button>
        <button class="menu-action" data-wall="left" type="button">Left wall</button>
        <button class="menu-action" data-wall="right" type="button">Right wall</button>
      </div>
    </div>
    <div id="settings-tools" hidden>
      <button class="menu-action active" id="smoothing-button" type="button">Sensor smoothing: On</button>
      <button class="menu-action active" id="camera-button" type="button">Camera: On / Rear</button>
      <button class="menu-action active" id="lines-button" type="button">World lines: On</button>
      <button class="menu-action" id="reset-zero-button" type="button">Reset zero point: Off</button>
    </div>
  </section>

  <section class="video-wall" id="video-wall" aria-label="YouTube video wall" hidden>
    <iframe id="youtube-frame" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  </section>
  <button class="video-close" id="video-wall-close" aria-label="Close video wall" hidden>&times;</button>

  <script type="module" src="app.js?v=13"></script>
</body>
</html>
